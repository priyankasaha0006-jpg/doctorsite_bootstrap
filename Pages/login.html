<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log-In</title>
    <link rel="stylesheet" href="./../style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"

<body>
    <section class="login_section">
        <div class="login">
            <div class="back_arrow">
                <a href="./find_doctor.html"><img src="./../asset/back arrow.png" alt="" width="20px" height="20px"></a>


            </div>
            <h1 class="login_heading">Enter Your Mobile Number</h1>
            <p class="join_community">Join the community today</p>
            <div class="button_login">
                <button class="btn rounded-pill get-started shadow px-3 py-3" type="submit">Use with Google</button>

            </div>
            <p>or</p>

            <div class="input_items_login">
                <div class="enter_name">
                    <p>Mobile number</p>
                    <input type="number" class="name_input_login" placeholder="983575XXX0">
                </div>
                <div class="enter_name">
                    <p>OTP</p>
                    <input type="text" class="name_input_login">
                </div>

            </div>
            <div class="button_login">
                <a href="./success.html"><button class="btn rounded-pill get-started shadow px-5 py-3" type="submit">Submit</button></a>
            </div>




        </div>
        <div class="dint_have_acc">
            <a href="./singin.html"><h6>Don’t have an Account? Sign In</h6></a>


        </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
